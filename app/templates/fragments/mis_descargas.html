<style>
  .page {
    display: flex; flex-direction: column;
    max-width: 960px; width: 100%; margin: 0 auto;
    padding: 1.5rem 1.25rem;
    height: 100%;
    position: relative; /* needed for absolute-positioned lyrics panel */
  }
  .toolbar {
    display: flex; align-items: center; gap: .75rem;
    flex-wrap: wrap; margin-bottom: 1rem; flex-shrink: 0;
  }
  .search-input {
    flex: 1; min-width: 160px;
    background: var(--surface2); border: 1px solid var(--border2);
    border-radius: var(--radius); color: var(--text);
    font-family: var(--font); font-size: .84rem;
    padding: .42rem .8rem; outline: none;
    transition: border-color .15s;
  }
  .search-input::placeholder { color: var(--muted); }
  .search-input:focus { border-color: var(--neon); }
  .btn {
    display: inline-flex; align-items: center; gap: .35rem;
    border: none; border-radius: var(--radius); cursor: pointer;
    font-family: var(--font); font-size: .82rem; padding: .42rem .8rem;
    transition: background .12s, color .12s, opacity .12s;
    text-decoration: none; white-space: nowrap;
  }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-ghost  { background: var(--surface2); color: var(--muted2); border: 1px solid var(--border2); }
  .btn-ghost:hover:not(:disabled)  { color: var(--text); border-color: var(--border); }
  .btn-neon   { background: var(--neon-dim); color: var(--neon); border: 1px solid rgba(57,255,20,.3); }
  .btn-neon:hover:not(:disabled)   { background: rgba(57,255,20,.2); }
  .btn-danger { background: var(--red-dim); color: var(--red); border: 1px solid rgba(255,77,77,.25); }
  .btn-danger:hover:not(:disabled) { background: rgba(255,77,77,.2); }
  .select-count { font-size: .8rem; color: var(--muted); margin-left: auto; }
  .table-wrap { flex: 1; overflow-x: auto; overflow-y: auto; }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    background: var(--bg); border-bottom: 1px solid var(--border);
    color: var(--muted); font-weight: 600; font-size: .72rem;
    text-transform: uppercase; letter-spacing: .05em;
    padding: .5rem .6rem; text-align: left;
    position: sticky; top: 0; z-index: 2;
  }
  thead th.col-check  { width: 2.2rem; text-align: center; }
  thead th.col-actions { width: 9.5rem; text-align: center; }
  thead th.col-size   { width: 6rem; text-align: right; }
  thead th.col-date   { width: 9rem; }
  tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover    { background: var(--neon-dim); }
  tbody tr.selected { background: rgba(57,255,20,.06); }
  td { padding: .55rem .6rem; vertical-align: middle; }
  td.col-check   { text-align: center; }
  td.col-actions { text-align: center; white-space: nowrap; }
  td.col-size    { color: var(--muted); font-size: .78rem; text-align: right; white-space: nowrap; }
  td.col-date    { color: var(--muted); font-size: .78rem; white-space: nowrap; }
  input[type=checkbox] { accent-color: var(--neon); width: 14px; height: 14px; cursor: pointer; }
  .title-cell { display: flex; align-items: center; gap: .5rem; max-width: 420px; }
  .title-text {
    flex: 1; font-size: .88rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .title-edit-wrap { display: none; flex: 1; gap: .35rem; align-items: center; }
  .title-edit-input {
    flex: 1; background: var(--surface3); border: 1px solid var(--neon);
    border-radius: 4px; color: var(--text); font-family: var(--font);
    font-size: .85rem; padding: .2rem .5rem; outline: none;
  }
  .title-save-btn, .title-cancel-btn {
    background: none; border: none; cursor: pointer; font-size: .85rem;
    padding: .1rem .3rem; border-radius: 3px; line-height: 1;
  }
  .title-save-btn   { color: var(--neon); }
  .title-save-btn:hover   { background: var(--neon-dim); }
  .title-cancel-btn { color: var(--muted); }
  .title-cancel-btn:hover { color: var(--red); }
  .row-btn {
    background: none; border: none; cursor: pointer;
    font-size: .8rem; padding: .2rem .45rem; border-radius: 4px;
    font-family: var(--font); transition: background .1s, color .1s;
    white-space: nowrap;
  }
  .row-btn.play { color: var(--neon); }
  .row-btn.play:hover { background: var(--neon-dim); }
  .row-btn.edit { color: var(--muted2); }
  .row-btn.edit:hover { color: var(--text); background: var(--surface2); }
  .row-btn.dl   { color: var(--neon); }
  .row-btn.dl:hover   { background: var(--neon-dim); }
  .row-btn.del  { color: var(--muted); }
  .row-btn.del:hover  { color: var(--red); background: var(--red-dim); }
  .empty-msg { text-align: center; color: var(--muted); padding: 4rem 1rem; font-size: .9rem; }
  #toast {
    position: fixed; bottom: calc(var(--player-h) + 1rem); left: 50%; transform: translateX(-50%);
    background: var(--surface2); border: 1px solid var(--border2);
    color: var(--text); padding: .55rem 1.2rem; border-radius: var(--radius);
    font-size: .84rem; box-shadow: 0 4px 16px rgba(0,0,0,.5);
    opacity: 0; pointer-events: none; transition: opacity .2s;
    white-space: nowrap; z-index: 200;
  }
  #toast.show { opacity: 1; }
  #toast.ok  { border-color: rgba(57,255,20,.4); color: var(--neon); }
  #toast.err { border-color: rgba(255,77,77,.4); color: var(--red); }

  /* ── Responsive ≤600px ── */
  @media (max-width: 600px) {
    .page { padding: 1rem .75rem; }
    .search-input { flex-basis: 100%; order: -1; padding: .65rem 1rem; font-size: .88rem; }
    .btn { padding: .65rem 1rem; font-size: .88rem; min-height: 44px; }
    thead th.col-size, thead th.col-date,
    td.col-size, td.col-date { display: none; }
    thead th.col-actions { width: 6rem; }
    tbody tr td { padding: .9rem .4rem; }
    input[type=checkbox] { width: 20px; height: 20px; }
    .row-btn { padding: .55rem .65rem; font-size: .88rem; min-height: 44px; display: inline-flex; align-items: center; }
    .row-btn.edit .edit-label { display: none; }
  }
</style>

<div class="page">
  <div class="toolbar">
    <input class="search-input" type="search" id="search-input"
           data-act-input="render" />
    <button class="btn btn-ghost" id="btn-select-all" data-act="toggleSelectAll"></button>
    <button class="btn btn-neon" id="btn-zip" data-act="downloadZip" disabled>
      ↓ ZIP
    </button>
    <button class="btn btn-danger" id="btn-delete-sel" data-act="deleteSelected" disabled></button>
    <span class="select-count" id="select-count"></span>
  </div>
  <div class="table-wrap">
    <div id="container"><div class="empty-msg" id="md-loading"></div></div>
  </div>

  <!-- Lyrics panel (engine in static/lyrics.js) -->
  <div class="lyrics-panel hidden" id="lyrics-panel">
    <div class="lyrics-header">
      <span class="lyrics-title" id="lyrics-panel-title"></span>
      <div class="lyrics-header-actions">
        <button class="lyrics-size-btn" data-act="lyricsShrink" title="Texto más pequeño">A−</button>
        <button class="lyrics-size-btn" data-act="lyricsGrow"   title="Texto más grande">A+</button>
        <button class="lyrics-close"    data-act="lyricsClose">✕</button>
      </div>
    </div>
    <div class="lyrics-body" id="lyrics-body"></div>
  </div>
</div>

<div id="toast"></div>

<script nonce="{{ csp_nonce }}">
(function () {
  // ── State ───────────────────────────────────────────────────────────────────
  let tracks         = [];
  let selected       = new Set();
  let lyricsEnabled  = false;

  // ── Static strings ───────────────────────────────────────────────────────────
  function applyStaticStrings() {
    const I = window.I18n;
    const searchEl    = document.getElementById('search-input');
    const selectAllEl = document.getElementById('btn-select-all');
    const deleteSelEl = document.getElementById('btn-delete-sel');
    const loadingEl   = document.getElementById('md-loading');
    if (searchEl)    searchEl.placeholder    = I.t('md.search');
    if (selectAllEl) selectAllEl.textContent = I.t('md.select_all');
    if (deleteSelEl) deleteSelEl.textContent = I.t('md.delete_sel');
    if (loadingEl)   loadingEl.textContent   = I.t('md.loading');
  }

  // ── Boot ────────────────────────────────────────────────────────────────────
  async function load() {
    _bindDelegation();
    applyStaticStrings();
    const [tracksRes, featRes] = await Promise.all([
      fetch('/mis-descargas/api/tracks'),
      fetch('/player/api/me/features'),
    ]);
    if (!tracksRes.ok) { toast(window.I18n.t('md.error_load'), 'err'); return; }
    tracks = await tracksRes.json();
    const feat = featRes.ok ? await featRes.json() : {};
    lyricsEnabled = Boolean(feat.lyrics_enabled);
    window.Lyrics?.setEnabled(lyricsEnabled);
    window._showLyricsBtn?.(lyricsEnabled);
    if (window.Player) window.Player.loadTracks(tracks);
    render();
  }

  // ── Render ──────────────────────────────────────────────────────────────────
  function render() {
    const q = document.getElementById('search-input').value.trim().toLowerCase();
    const visible = q
      ? tracks.filter(t => (t.title || '').toLowerCase().includes(q))
      : tracks;

    const container = document.getElementById('container');
    const I = window.I18n;

    if (!visible.length) {
      container.innerHTML = `<div class="empty-msg">${I.t('md.empty')}</div>`;
      if (!lyricsEnabled) window.Lyrics?.close();
      updateToolbar();
      return;
    }

    container.innerHTML = `
      <table>
        <thead>
          <tr>
            <th class="col-check">
              <input type="checkbox" id="chk-all" data-act-change="selectAll" />
            </th>
            <th>${I.t('md.col_title')}</th>
            <th class="col-size">${I.t('md.col_size')}</th>
            <th class="col-date">${I.t('md.col_date')}</th>
            ${lyricsEnabled ? `<th class="col-lyrics"></th>` : ''}
            <th class="col-actions">${I.t('md.col_actions')}</th>
          </tr>
        </thead>
        <tbody>
          ${visible.map(t => rowHtml(t)).join('')}
        </tbody>
      </table>
    `;
    updateToolbar();
    if (!lyricsEnabled) window.Lyrics?.close();
  }

  function rowHtml(t) {
    const chk   = selected.has(t.job_id) ? 'checked' : '';
    const sel   = selected.has(t.job_id) ? 'selected' : '';
    const title = esc(t.title || t.job_id);
    const size  = fmtSize(t.file_size);
    const date  = fmtDate(t.created_at);
    const I = window.I18n;
    return `
      <tr data-job="${t.job_id}" class="${sel}">
        <td class="col-check">
          <input type="checkbox" ${chk}
                 data-act-change="toggleSelect" data-job="${t.job_id}" />
        </td>
        <td>
          <div class="title-cell">
            <span class="title-text" id="title-text-${t.job_id}" title="${title}">${title}</span>
            <div class="title-edit-wrap" id="title-edit-${t.job_id}">
              <input class="title-edit-input" id="title-input-${t.job_id}"
                     value="${title}"
                     data-act-keydown="onEditKey" data-job="${t.job_id}" />
              <button class="title-save-btn"   data-act="saveRename" data-job="${t.job_id}">✓</button>
              <button class="title-cancel-btn" data-act="cancelRename" data-job="${t.job_id}">✕</button>
            </div>
          </div>
        </td>
        <td class="col-size">${size}</td>
        <td class="col-date">${date}</td>
        ${lyricsEnabled ? `
        <td class="col-lyrics" data-act="none">
          <button class="lyrics-btn" data-act="openLyrics" data-job="${t.job_id}"
                  id="lyrbtn-${t.job_id}" title="${I.t('player.lyrics')}">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
              <path d="M8 1a2.5 2.5 0 0 1 2.5 2.5v4a2.5 2.5 0 0 1-5 0v-4A2.5 2.5 0 0 1 8 1zm0 1A1.5 1.5 0 0 0 6.5 3.5v4a1.5 1.5 0 0 0 3 0v-4A1.5 1.5 0 0 0 8 2zm-4.5 5a.5.5 0 0 1 .5.5A4.5 4.5 0 0 0 12.5 7.5a.5.5 0 0 1 1 0A5.5 5.5 0 0 1 8.5 12.95V15h1a.5.5 0 0 1 0 1h-3a.5.5 0 0 1 0-1h1v-2.05A5.5 5.5 0 0 1 3 7.5a.5.5 0 0 1 .5-.5z"/>
            </svg>
          </button>
        </td>` : ''}
        <td class="col-actions">
          <button class="row-btn play" data-act="playTrack" data-job="${t.job_id}" title="${I.t('md.play')}">▶</button>
          <button class="row-btn edit" data-act="startRename" data-job="${t.job_id}" title="${I.t('md.rename')}">✎ <span class="edit-label">${I.t('md.rename').replace(/^✎\s*/, '')}</span></button>
          <a class="row-btn dl" href="/files/${t.job_id}.mp3" download title="${I.t('md.download')}">↓</a>
          <button class="row-btn del" data-act="deleteSingle" data-job="${t.job_id}" title="${I.t('md.delete')}">✕</button>
        </td>
      </tr>
    `;
  }

  // ── Selection ────────────────────────────────────────────────────────────────
  function toggleSelect(jobId, checked) {
    if (checked) selected.add(jobId);
    else         selected.delete(jobId);
    const row = document.querySelector(`tr[data-job="${jobId}"]`);
    if (row) row.classList.toggle('selected', checked);
    updateToolbar();
  }

  function selectAll(checked) {
    const visible = getVisible();
    visible.forEach(t => {
      if (checked) selected.add(t.job_id);
      else         selected.delete(t.job_id);
    });
    render();
  }

  function toggleSelectAll() {
    const visible     = getVisible();
    const allSelected = visible.every(t => selected.has(t.job_id));
    selectAll(!allSelected);
  }

  function getVisible() {
    const q = document.getElementById('search-input').value.trim().toLowerCase();
    return q ? tracks.filter(t => (t.title || '').toLowerCase().includes(q)) : tracks;
  }

  function updateToolbar() {
    const n = selected.size;
    document.getElementById('btn-zip').disabled        = n === 0;
    document.getElementById('btn-delete-sel').disabled = n === 0;
    const en = window.I18n && window.I18n.getLang() === 'en';
    document.getElementById('select-count').textContent = n
      ? (en ? `${n} selected` : `${n} seleccionada${n > 1 ? 's' : ''}`)
      : '';
    const chkAll = document.getElementById('chk-all');
    if (chkAll) {
      const visible = getVisible();
      chkAll.checked       = visible.length > 0 && visible.every(t => selected.has(t.job_id));
      chkAll.indeterminate = !chkAll.checked && visible.some(t => selected.has(t.job_id));
    }
  }

  // ── Rename ───────────────────────────────────────────────────────────────────
  function startRename(jobId) {
    document.getElementById(`title-text-${jobId}`).style.display = 'none';
    const wrap = document.getElementById(`title-edit-${jobId}`);
    wrap.style.display = 'flex';
    const input = document.getElementById(`title-input-${jobId}`);
    input.focus(); input.select();
  }

  function cancelRename(jobId) {
    document.getElementById(`title-edit-${jobId}`).style.display = 'none';
    document.getElementById(`title-text-${jobId}`).style.display = '';
  }

  function onEditKey(e, jobId) {
    if (e.key === 'Enter')  { e.preventDefault(); saveRename(jobId); }
    if (e.key === 'Escape') { cancelRename(jobId); }
  }

  async function saveRename(jobId) {
    const input    = document.getElementById(`title-input-${jobId}`);
    const newTitle = input.value.trim();
    if (!newTitle) return;
    const res = await fetch(`/mis-descargas/api/tracks/${jobId}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title: newTitle }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      toast(err.error || window.I18n.t('md.error_rename'), 'err');
      return;
    }
    const data = await res.json();
    const track = tracks.find(t => t.job_id === jobId);
    if (track) { track.title = data.title; track.file_name = data.file_name; }
    const span = document.getElementById(`title-text-${jobId}`);
    span.textContent = esc(data.title);
    span.title       = esc(data.title);
    cancelRename(jobId);
    toast(window.I18n.t('md.renamed'), 'ok');
  }

  // ── Delete ───────────────────────────────────────────────────────────────────
  async function deleteSingle(jobId) {
    if (!confirm(window.I18n.t('md.confirm_del_one'))) return;
    const ok = await apiDelete(jobId);
    if (ok) {
      tracks = tracks.filter(t => t.job_id !== jobId);
      selected.delete(jobId);
      render();
      toast(window.I18n.t('md.deleted'), 'ok');
    }
  }

  async function deleteSelected() {
    const ids = [...selected];
    if (!ids.length) return;
    const en = window.I18n && window.I18n.getLang() === 'en';
    const confirmMsg = en
      ? `Delete ${ids.length} song${ids.length > 1 ? 's' : ''}?`
      : `¿Eliminar ${ids.length} canción${ids.length > 1 ? 'es' : ''}?`;
    if (!confirm(confirmMsg)) return;
    let failed = 0;
    for (const id of ids) {
      const ok = await apiDelete(id);
      if (ok) { tracks = tracks.filter(t => t.job_id !== id); selected.delete(id); }
      else     failed++;
    }
    render();
    if (failed) {
      const errMsg = en
        ? `${failed} error${failed > 1 ? 's' : ''} deleting`
        : `${failed} error${failed > 1 ? 'es' : ''} al eliminar`;
      toast(errMsg, 'err');
    } else {
      const doneMsg = en
        ? `${ids.length} song${ids.length > 1 ? 's' : ''} deleted`
        : `${ids.length} eliminada${ids.length > 1 ? 's' : ''}`;
      toast(doneMsg, 'ok');
    }
  }

  async function apiDelete(jobId) {
    const res = await fetch(`/mis-descargas/api/tracks/${jobId}`, { method: 'DELETE' });
    return res.ok;
  }

  // ── ZIP ──────────────────────────────────────────────────────────────────────
  function downloadZip() {
    const ids = [...selected];
    if (!ids.length) return;
    const qs = ids.length === tracks.length ? '' : `?job_ids=${ids.join(',')}`;
    window.location.href = `/mis-descargas/api/tracks/zip${qs}`;
  }

  // ── Helpers ──────────────────────────────────────────────────────────────────
  function fmtSize(bytes) {
    if (!bytes) return '';
    if (bytes >= 1048576) return (bytes / 1048576).toFixed(1) + ' MB';
    return Math.round(bytes / 1024) + ' KB';
  }
  function fmtDate(iso) {
    if (!iso) return '';
    return new Date(iso).toLocaleDateString('es', { year:'numeric', month:'2-digit', day:'2-digit' });
  }
  // ── Event delegation ────────────────────────────────────────────────────────
  // See player.html for the rationale: inline handlers are what force
  // script-src 'unsafe-inline'. Actions travel as data-act, parameters as
  // data-*, and closest() picks the innermost so nested controls win without
  // stopPropagation (data-act="none" swallows a click outright).
  const CLICK_ACTIONS = {
    none:            () => {},
    toggleSelectAll: () => toggleSelectAll(),
    downloadZip:     () => downloadZip(),
    deleteSelected:  () => deleteSelected(),
    lyricsShrink:    () => window.Lyrics?.shrink(),
    lyricsGrow:      () => window.Lyrics?.grow(),
    lyricsClose:     () => window.Lyrics?.close(),
    openLyrics:      (el) => window.Lyrics?.open(el.dataset.job),
    playTrack:       (el) => window.Player && window.Player.playTrack(el.dataset.job),
    startRename:     (el) => startRename(el.dataset.job),
    saveRename:      (el) => saveRename(el.dataset.job),
    cancelRename:    (el) => cancelRename(el.dataset.job),
    deleteSingle:    (el) => deleteSingle(el.dataset.job),
  };

  const CHANGE_ACTIONS = {
    selectAll:    (el) => selectAll(el.checked),
    toggleSelect: (el) => toggleSelect(el.dataset.job, el.checked),
  };

  const INPUT_ACTIONS   = { render: () => render() };
  const KEYDOWN_ACTIONS = { onEditKey: (el, ev) => onEditKey(ev, el.dataset.job) };

  function _asTarget(ev, el) {
    try {
      Object.defineProperty(ev, 'currentTarget', { value: el, configurable: true });
    } catch (_) { /* ignored */ }
    return ev;
  }

  function _dispatch(table, attr) {
    return (ev) => {
      const el = ev.target.closest(`[${attr}]`);
      if (!el) return;
      const fn = table[el.getAttribute(attr)];
      if (fn) fn(el, _asTarget(ev, el));
    };
  }

  // Rebound on every SPA visit; the previous listeners would otherwise keep
  // dispatching into the previous fragment's closures.
  function _bindDelegation() {
    const root = document;
    if (root._misDelegation) {
      root._misDelegation.forEach(([type, fn]) => root.removeEventListener(type, fn));
    }
    const bound = [];
    const add = (type, fn) => { root.addEventListener(type, fn); bound.push([type, fn]); };
    add('click',   _dispatch(CLICK_ACTIONS,   'data-act'));
    add('change',  _dispatch(CHANGE_ACTIONS,  'data-act-change'));
    add('input',   _dispatch(INPUT_ACTIONS,   'data-act-input'));
    add('keydown', _dispatch(KEYDOWN_ACTIONS, 'data-act-keydown'));
    root._misDelegation = bound;
  }

  function esc(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  let _toastTimer = null;
  function toast(msg, type = 'ok') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className   = `show ${type}`;
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => { el.className = ''; }, 2800);
  }

  // Make functions available as globals for inline onclick in generated HTML
  window.toggleSelect    = toggleSelect;
  window.selectAll       = selectAll;
  window.toggleSelectAll = toggleSelectAll;
  window.startRename     = startRename;
  window.cancelRename    = cancelRename;
  window.onEditKey       = onEditKey;
  window.saveRename      = saveRename;
  window.deleteSingle    = deleteSingle;
  window.deleteSelected  = deleteSelected;
  window.downloadZip     = downloadZip;
  window.render          = render;

  // Re-render when language changes
  document.addEventListener('i18n:change', () => {
    applyStaticStrings();
    render();
  });

  // On a direct page load (bookmark, refresh, typed URL) this fragment is
  // inlined by shell.html *above* the shared <script src> tags, so it runs
  // before /static/i18n.js has been evaluated: window.I18n is undefined and
  // the first I.t() in applyStaticStrings() throws, leaving the table empty.
  // shell.html fires 'i18n:change' once I18n.init() completes, so wait for it.
  // Reached through an SPA navigation, I18n is already there and we go now.
  // player.html carries the same guard; this fragment was missing it.
  if (window.I18n) {
    load();
  } else {
    document.addEventListener('i18n:change', () => load(), { once: true });
  }
})();
</script>
